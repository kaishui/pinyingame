<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>挂牌底卡生成器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;background:#eef0f4;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:14px}
.app-container{width:100%;max-width:1280px;background:#fff;border-radius:20px;box-shadow:0 12px 38px rgba(0,0,0,.10);padding:22px 24px 28px}
.app-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #f0f2f5}
.app-header h1{font-size:21px;font-weight:800;color:#1a1a2e}
.app-header h1 small{font-size:12px;font-weight:400;color:#999;margin-left:6px}
.header-hint{font-size:12px;color:#999;background:#f5f6fa;padding:6px 12px;border-radius:30px}
.main-layout{display:flex;gap:24px;flex-wrap:wrap}
.control-panel{flex:0 0 340px;min-width:290px;display:flex;flex-direction:column;gap:12px}
.preview-panel{flex:1;min-width:440px;background:#f7f8fb;border-radius:14px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;min-height:560px}
.control-group{background:#f8f9fc;border-radius:12px;padding:13px 15px}
.control-group>label{display:block;font-size:14px;font-weight:700;color:#2d3436;margin-bottom:8px}
.control-group>label .unit{font-weight:400;color:#999;font-size:11.5px;margin-left:3px}
.class-color-row{display:flex;flex-wrap:wrap;gap:7px}
.class-swatch{flex:0 0 calc(25% - 5.5px);border-radius:9px;padding:13px 4px;text-align:center;cursor:pointer;font-weight:800;font-size:13px;border:3px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.10);min-height:40px}
.class-swatch.active{border-color:#2d3436;box-shadow:0 0 0 2px #fff,0 0 0 4px #2d3436}
.custom-color-row{display:flex;align-items:center;gap:9px;margin-top:9px}
.custom-color-row input[type=color]{width:40px;height:40px;border:2px solid #dfe6e9;border-radius:8px;cursor:pointer;padding:2px;background:#fff}
.custom-color-row span{font-size:12px;color:#888}
.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.size-btn{padding:10px 0;border:2px solid #dfe6e9;border-radius:8px;background:#fff;font-size:13px;font-weight:700;color:#555;cursor:pointer;text-align:center}
.size-btn.active{background:#2d3436;color:#fff;border-color:#2d3436}
.layout-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.opt-btn{padding:10px 6px;border:2px solid #dfe6e9;border-radius:8px;background:#fff;font-size:13px;font-weight:700;color:#555;cursor:pointer;text-align:center}
.opt-btn.active{background:#2d3436;color:#fff;border-color:#2d3436}
.input-row{display:flex;align-items:center;gap:9px;margin-top:8px}
.input-row label{font-size:13px;font-weight:600;color:#555;min-width:44px}
.input-row input{flex:1;padding:8px 11px;border:2px solid #dfe6e9;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;outline:none;min-width:0}
.input-row input:focus{border-color:#2d3436}
.auto-font{display:flex;align-items:center;gap:5px;font-weight:500;font-size:12px;color:#555;cursor:pointer}
.action-buttons{display:flex;gap:9px}
.action-btn{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.action-btn.primary{background:#2d3436;color:#fff}
.action-btn.success{background:#00b894;color:#fff}
.action-btn.ghost{background:#fff;color:#2d3436;border:2px solid #dfe6e9}
.hint-line{margin-top:8px;font-size:11px;color:#bbb;text-align:center;line-height:1.5}
.preview-label{font-size:12px;color:#bbb;letter-spacing:1px;margin-bottom:10px}
.stage{display:flex;align-items:flex-start;justify-content:center;width:100%}

.paper{position:relative;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.13);border-radius:6px;width:100%;max-width:440px}
.paper .paper-tag{position:absolute;bottom:4px;right:8px;font-size:11px;color:#b9bec7;pointer-events:none}
.paper.exporting{box-shadow:none!important;border-radius:0!important}
.paper.exporting .paper-tag{display:none!important}

.card{position:absolute;overflow:visible;border-radius:8px;box-shadow:0 5px 18px rgba(0,0,0,.2);transform-origin:center center}
.text-el{position:absolute;transform:translate(-50%,-50%);transform-origin:center center;cursor:grab;white-space:nowrap;user-select:none;touch-action:none;padding:2px 6px;border-radius:4px;font-weight:700;line-height:1.18;min-width:10px;min-height:1em;outline:none;text-align:center;z-index:2}
.text-el:active{cursor:grabbing}
.text-el:focus{outline:1.5px dashed rgba(45,52,54,.85);outline-offset:2px}
.text-el[contenteditable]:empty::before{content:''}

@media (max-width:880px){
  .main-layout{flex-direction:column-reverse}
  .control-panel{flex:1;width:100%}
  .preview-panel{min-width:0;min-height:400px;order:-1}
  .paper{max-width:340px}
  .app-container{padding:16px 14px 20px}
}
@media print{body{background:#fff;padding:0}.app-container,.app-header,.control-panel,.preview-label{display:none!important}.preview-panel{background:#fff!important;padding:0!important;min-height:100vh;justify-content:center}.paper{box-shadow:none!important;border-radius:0!important;max-width:100%!important}}
</style>
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <h1>🏷️ 挂牌底卡生成器<small>点卡片上的字直接改 · 拖动摆位置</small></h1>
    <span class="header-hint">📐 工牌横/竖 · 排版预设</span>
  </header>

  <div class="main-layout">
    <div class="control-panel">
      <!-- 各班色卡 -->
      <div class="control-group"><label>🧑‍🏫 各班色卡</label>
        <div class="class-color-row" id="classColorRow"></div>
        <div class="custom-color-row"><input type="color" id="customColor" value="#1B2E91" /><span>自定义颜色</span></div>
      </div>

      <!-- 尺寸 -->
      <div class="control-group"><label>📏 尺寸</label>
        <div class="size-grid" id="sizeGrid"></div>
        <div class="input-row" id="customSizeRow" style="display:none;">
          <label>宽</label><input type="number" id="customW" value="90" min="5" max="1000" inputmode="decimal" /><span style="font-size:11px;color:#999;">mm</span>
          <label>高</label><input type="number" id="customH" value="120" min="5" max="1000" inputmode="decimal" /><span style="font-size:11px;color:#999;">mm</span>
        </div>
      </div>

      <!-- 打印纸 -->
      <div class="control-group"><label>🖨️ 打印纸 <span class="unit">（底部参考）</span></label>
        <div class="size-grid" id="printSheetGrid"></div>
      </div>

      <!-- 排版 -->
      <div class="control-group"><label>🀄 排版</label>
        <div class="layout-grid" id="layoutGrid"></div>
      </div>

      <!-- 旋转 -->
      <div class="control-group"><label>🔄 旋转</label>
        <div class="opt-row" id="rotateRow" style="display:flex;gap:6px;">
          <button class="opt-btn active" data-val="0">0°</button>
          <button class="opt-btn" data-val="90">90°</button>
          <button class="opt-btn" data-val="180">180°</button>
          <button class="opt-btn" data-val="270">270°</button>
        </div>
        <label class="auto-font" style="margin-top:8px;"><input type="checkbox" id="textFollowCard" checked /> 文字随卡片一起旋转</label>
      </div>

      <!-- 字体颜色 -->
      <div class="control-group"><label>🖋️ 字体颜色</label>
        <div class="input-row" style="margin-top:0;">
          <label>颜色</label><input type="color" id="fontColor" value="#ffffff" /><label class="auto-font"><input type="checkbox" id="autoFontColor" checked /> 自动</label>
        </div>
      </div>

      <!-- 操作 -->
      <div class="control-group" style="background:transparent;padding:0">
        <div class="action-buttons">
          <button class="action-btn ghost" id="resetBtn">↺ 恢复默认</button>
          <button class="action-btn primary" id="printBtn">🖨️ 打印</button>
          <button class="action-btn success" id="exportBtn">⬇️ 存照片</button>
        </div>
        <div class="hint-line">💡 点卡片上的字直接改内容；按住拖动摆位置；清空内容即不显示</div>
      </div>
    </div>

    <div class="preview-panel">
      <div class="preview-label">📋 预览（虚线=打印纸参考）</div>
      <div class="stage" id="stage"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const SIZES = [
    { key:'a1',label:'A1',w:594,h:841 },{ key:'a2',label:'A2',w:420,h:594 },
    { key:'a3',label:'A3',w:297,h:420 },{ key:'a4',label:'A4',w:210,h:297 },
    { key:'a5',label:'A5',w:148,h:210 },{ key:'a6',label:'A6',w:105,h:148 },
    { key:'a7',label:'A7',w:74,h:105 },{ key:'a8',label:'A8',w:52,h:74 },
    { key:'6',label:'6寸',w:102,h:152 },
    { key:'id1h',label:'工牌横',w:85.6,h:54 },
    { key:'id1v',label:'工牌竖',w:54,h:85.6 },
  ];
  const sizeOf = (k) => SIZES.find(s => s.key === k);
  const CLASS_COLORS = [
    { label:'一1班', bg:'#1B2E91', text:'#ffffff' },{ label:'一2班', bg:'#B39DDB', text:'#3d2b56' },
    { label:'一3班', bg:'#1E78D8', text:'#ffffff' },{ label:'一4班', bg:'#F06CA8', text:'#5c1a3d' },
    { label:'一5班', bg:'#FFE93B', text:'#6b5b00' },{ label:'一6班', bg:'#3FA24A', text:'#ffffff' },
    { label:'一7班', bg:'#F59A18', text:'#7a4a00' },{ label:'一8班', bg:'#E43232', text:'#ffffff' },
  ];
  // 文字元素定义
  const FIELDS = [
    { key:'cls', label:'班级', def:'一1班', fs:20 },
    { key:'name', label:'姓名', def:'张三', fs:46 },
    { key:'slogan', label:'标语', def:'文明礼仪', fs:18 },
    { key:'org', label:'学校', def:'广州市番禺区市桥富都小学', fs:13 },
  ];
  // 排版预设（位置 x/y 百分比）
  const LAYOUTS = [
    { key:'stack', label:'居中上下', pos:{ cls:[50,30], name:[50,46], slogan:[50,74], org:[50,90] } },
    { key:'hrow', label:'居中横排', pos:{ cls:[38,46], name:[62,46], slogan:[50,75], org:[50,90] } },
    { key:'left', label:'左对齐', pos:{ cls:[16,18], name:[16,44], slogan:[16,74], org:[16,90] } },
    { key:'right', label:'右对齐', pos:{ cls:[84,18], name:[84,44], slogan:[84,74], org:[84,90] } },
  ];

  let currentSize = 'id1h';
  let printSheet = 'a6';
  let useCustom = false;
  let currentColor = '#1B2E91';
  let cardRotation = 0;
  let elements = { cls:{x:50,y:30}, name:{x:50,y:46}, slogan:{x:50,y:74}, org:{x:50,y:90} };

  function hexToRgb(hex){const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null;}
  function bright(hex){const r=hexToRgb(hex);return r?(r.r*299+r.g*587+r.b*114)/1000:255;}
  function resolveTextColor(bg){ if($('autoFontColor').checked){return bright(bg)>170?'#1a1a2e':'#ffffff';} return $('fontColor').value||'#1a1a2e'; }
  function currentCardSize(){ if(useCustom){ const w=Math.max(5,Number($('customW').value)||90); const h=Math.max(5,Number($('customH').value)||120); return {key:'custom',label:w+'×'+h,w,h}; } return sizeOf(currentSize); }

  function renderClassColors(){
    const row = $('classColorRow'); row.innerHTML = '';
    CLASS_COLORS.forEach(c => {
      const d = document.createElement('button');
      d.className = 'class-swatch' + (currentColor === c.bg ? ' active' : '');
      d.style.backgroundColor = c.bg; d.style.color = c.text; d.textContent = c.label;
      d.onclick = () => { currentColor = c.bg; $('customColor').value = c.bg; $('autoFontColor').checked = false; $('fontColor').value = c.text; $('fontColor').disabled = false; setElText('cls', c.label); renderClassColors(); renderCard(); };
      row.appendChild(d);
    });
  }
  function renderSizes(){
    $('sizeGrid').innerHTML = '';
    SIZES.forEach(s => {
      const b = document.createElement('button');
      b.className = 'size-btn' + (s.key===currentSize && !useCustom ? ' active':'');
      b.textContent = s.label;
      b.onclick = () => { useCustom=false; currentSize=s.key; renderSizes(); renderCard(); };
      $('sizeGrid').appendChild(b);
    });
    const cb = document.createElement('button');
    cb.className = 'size-btn' + (useCustom ? ' active':'');
    cb.textContent = '自定义';
    cb.onclick = () => { useCustom=true; renderSizes(); renderCard(); };
    $('sizeGrid').appendChild(cb);
    $('customSizeRow').style.display = useCustom ? 'flex' : 'none';

    $('printSheetGrid').innerHTML = '';
    ['a4','a5','a6'].forEach(k => {
      const s = sizeOf(k), b = document.createElement('button');
      b.className = 'size-btn' + (k===printSheet ? ' active':'');
      b.textContent = s.label;
      b.onclick = () => { printSheet=k; renderSizes(); renderCard(); };
      $('printSheetGrid').appendChild(b);
    });
  }
  function renderLayouts(){
    const g = $('layoutGrid'); g.innerHTML = '';
    LAYOUTS.forEach(L => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = L.label;
      b.onclick = () => { applyLayout(L); };
      g.appendChild(b);
    });
  }
  function applyLayout(L){
    FIELDS.forEach(f => { elements[f.key].x = L.pos[f.key][0]; elements[f.key].y = L.pos[f.key][1]; });
    renderCard();
  }
  function setElText(key, txt){
    const el = document.querySelector(`.text-el[data-key="${key}"]`);
    if (el) { el.textContent = txt; updateVisible(el); }
  }

  // ===== 渲染卡片 =====
  function renderCard(){
    const stage = $('stage'); stage.innerHTML = '';
    const paper = document.createElement('div');
    paper.className = 'paper';
    const ps = sizeOf(printSheet);
    paper.style.aspectRatio = (ps.w/ps.h);
    paper.innerHTML = '<div class="paper-tag">打印纸 '+ps.label+'</div>';
    const cs = currentCardSize();
    const margin = 4, maxW = ps.w - margin*2, maxH = ps.h - margin*2;
    let w = cs.w, h = cs.h;
    const sc = Math.min(1, maxW/w, maxH/h); w *= sc; h *= sc;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.width = (w/ps.w*100)+'%';
    card.style.height = (h/ps.h*100)+'%';
    card.style.left = ((ps.w-w)/2/ps.w*100)+'%';
    card.style.top = ((ps.h-h)/2/ps.h*100)+'%';
    card.style.backgroundColor = currentColor;
    card.style.color = resolveTextColor(currentColor);
    card.style.transform = cardRotation ? `rotate(${cardRotation}deg)` : '';
    const counter = $('textFollowCard').checked ? 0 : -cardRotation;
    FIELDS.forEach(f => {
      const el = document.createElement('div');
      el.className = 'text-el';
      el.dataset.key = f.key;
      el.contentEditable = 'true';
      el.textContent = f.def;
      el.style.fontSize = f.fs + 'px';
      applyTransform(el, f.key, counter);
      el.addEventListener('input', () => updateVisible(el));
      el.addEventListener('pointerdown', (e) => startDrag(e, f.key, card, counter));
      card.appendChild(el);
    });
    paper.appendChild(card);
    stage.appendChild(paper);
  }
  function applyTransform(el, key, counter){
    const e = elements[key];
    el.style.left = e.x + '%';
    el.style.top = e.y + '%';
    el.style.transform = `translate(-50%,-50%) rotate(${counter}deg)`;
  }
  function updateVisible(el){
    el.style.display = el.textContent.replace(/\s/g,'') === '' ? 'none' : '';
  }

  function startDrag(e, key, card, counter){
    const rect = card.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const ox = elements[key].x, oy = elements[key].y;
    const el = e.currentTarget;
    let moved = false;
    const move = (ev) => {
      const d = Math.abs(ev.clientX-sx) + Math.abs(ev.clientY-sy);
      if (d > 6) { moved = true; ev.preventDefault(); }
      if (moved) {
        elements[key].x = Math.max(0, Math.min(100, ox + (ev.clientX-sx)/rect.width*100));
        elements[key].y = Math.max(0, Math.min(100, oy + (ev.clientY-sy)/rect.height*100));
        applyTransform(el, key, counter);
      }
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      if (!moved) el.focus(); // 点一下 → 编辑
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }

  // ===== 恢复默认 =====
  function resetAll(){
    useCustom = false; currentSize = 'id1h'; printSheet = 'a6'; currentColor = '#1B2E91'; cardRotation = 0;
    $('autoFontColor').checked = true; $('fontColor').value = '#ffffff'; $('fontColor').disabled = true;
    elements = { cls:{x:50,y:30}, name:{x:50,y:46}, slogan:{x:50,y:74}, org:{x:50,y:90} };
    $('customColor').value = '#1B2E91';
    renderClassColors(); renderSizes(); renderCard();
    setElText('cls','一1班'); setElText('name','张三'); setElText('slogan','文明礼仪'); setElText('org','广州市番禺区市桥富都小学');
    // 重置旋转按钮高亮
    document.querySelectorAll('#rotateRow .opt-btn').forEach(x=>x.classList.toggle('active', x.dataset.val==='0'));
  }

  // ===== 打印 / 导出 =====
  function printTarget(){
    const ps = sizeOf(printSheet);
    let st = document.getElementById('printPageStyle');
    if (!st) { st = document.createElement('style'); st.id='printPageStyle'; document.head.appendChild(st); }
    st.textContent = `@page { size: ${ps.w}mm ${ps.h}mm; margin: 0; }`;
    window.print();
    setTimeout(()=>{ st.textContent=''; }, 400);
  }
  async function exportPNG(){
    const target = $('stage').firstChild;
    target.classList.add('exporting');
    try {
      const canvas = await html2canvas(target, { scale:4, useCORS:true, backgroundColor:'#ffffff', logging:false });
      const name = (document.querySelector('.text-el[data-key="name"]')||{}).textContent || '姓名';
      const a = document.createElement('a');
      a.download = `挂牌底卡_${currentCardSize().label}_${name}.png`;
      a.href = canvas.toDataURL('image/png'); a.click();
    } catch(e){ alert('导出失败'); }
    finally { target.classList.remove('exporting'); }
  }

  // ===== 事件 =====
  $('customColor').addEventListener('input', e => { currentColor = e.target.value; renderClassColors(); renderCard(); });
  $('customW').addEventListener('input', ()=>{ if (useCustom) renderCard(); });
  $('customH').addEventListener('input', ()=>{ if (useCustom) renderCard(); });
  $('autoFontColor').addEventListener('change', ()=>{ $('fontColor').disabled = $('autoFontColor').checked; renderCard(); });
  $('fontColor').addEventListener('input', ()=>{ if (!$('autoFontColor').checked) renderCard(); });
  $('textFollowCard').addEventListener('change', renderCard);
  $('resetBtn').addEventListener('click', resetAll);
  $('printBtn').addEventListener('click', printTarget);
  $('exportBtn').addEventListener('click', exportPNG);
  $('rotateRow').addEventListener('click', e => {
    const b = e.target.closest('.opt-btn'); if(!b) return;
    document.querySelectorAll('#rotateRow .opt-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); cardRotation = Number(b.dataset.val); renderCard();
  });

  // ===== 初始化 =====
  function init(){
    $('fontColor').disabled = true;
    renderClassColors(); renderSizes(); renderLayouts(); renderCard();
    setElText('cls','一1班'); setElText('name','张三'); setElText('slogan','文明礼仪'); setElText('org','广州市番禺区市桥富都小学');
  }
  init();
  window.__cardGen = { resetAll, exportPNG };
})();
</script>
</body>
</html>
