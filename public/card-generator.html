<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>挂牌底卡生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: #eef0f4; min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start; padding: 20px;
        }
        .app-container {
            width: 100%; max-width: 1320px; background: #fff; border-radius: 24px;
            box-shadow: 0 16px 50px rgba(0,0,0,.10); padding: 28px 32px 34px;
        }
        .app-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 2px solid #f0f2f5; }
        .app-header h1 { font-size: 24px; font-weight: 800; color: #1a1a2e; }
        .app-header h1 small { font-size: 13px; font-weight: 400; color: #999; margin-left: 6px; }
        .header-hint { font-size: 13px; color: #999; background: #f5f6fa; padding: 6px 14px; border-radius: 30px; }

        .main-layout { display: flex; gap: 32px; flex-wrap: wrap; }
        .control-panel { flex: 0 0 340px; min-width: 280px; display: flex; flex-direction: column; gap: 16px; }
        .preview-panel { flex: 1; min-width: 420px; background: #f7f8fb; border-radius: 18px; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; min-height: 560px; }

        .control-group { background: #f8f9fc; border-radius: 14px; padding: 16px 18px; }
        .control-group > label { display: block; font-size: 14px; font-weight: 700; color: #2d3436; margin-bottom: 10px; }
        .control-group > label .unit { font-weight: 400; color: #999; font-size: 12px; margin-left: 4px; }

        /* 模式切换 */
        .mode-tabs { display: flex; gap: 10px; }
        .mode-tab { flex: 1; padding: 10px 0; border: 2px solid #dfe6e9; border-radius: 10px; background: #fff; font-size: 15px; font-weight: 700; color: #666; cursor: pointer; text-align: center; transition: .15s; }
        .mode-tab.active { background: #2d3436; color: #fff; border-color: #2d3436; }

        /* 尺寸按钮 */
        .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .size-btn { padding: 9px 0; border: 2px solid #dfe6e9; border-radius: 9px; background: #fff; font-size: 14px; font-weight: 700; color: #555; cursor: pointer; text-align: center; transition: .15s; }
        .size-btn.active { background: #2d3436; color: #fff; border-color: #2d3436; }

        /* 色卡：正方格横排 */
        .color-row { display: flex; gap: 9px; overflow-x: auto; padding: 3px 2px 6px; }
        .color-swatch { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 9px; border: 3px solid transparent; cursor: pointer; position: relative; transition: .15s; box-shadow: 0 2px 5px rgba(0,0,0,.08); }
        .color-swatch:hover { transform: scale(1.08); }
        .color-swatch.active { border-color: #2d3436; box-shadow: 0 0 0 2px #fff, 0 0 0 5px #2d3436; }
        .color-swatch .ck { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.5); opacity: 0; }
        .color-swatch.active .ck { opacity: 1; }
        .custom-color-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .custom-color-row input[type="color"] { width: 40px; height: 40px; border: 2px solid #dfe6e9; border-radius: 8px; cursor: pointer; padding: 2px; background: #fff; }
        .custom-color-row span { font-size: 12px; color: #888; }

        /* 输入 */
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        .input-row label { font-size: 13px; font-weight: 600; color: #555; min-width: 44px; }
        .input-row input, .input-row textarea { flex: 1; padding: 8px 12px; border: 2px solid #dfe6e9; border-radius: 9px; font-size: 14px; font-family: inherit; background: #fff; outline: none; min-width: 0; }
        .input-row input:focus, .input-row textarea:focus { border-color: #2d3436; }
        .auto-font { display: flex; align-items: center; gap: 5px; min-width: auto; font-weight: 500; font-size: 12px; color: #555; cursor: pointer; }

        /* 拼版卡片列表 */
        .sheet-size-row { display: flex; align-items: center; gap: 10px; }
        .card-list { display: flex; flex-direction: column; gap: 10px; }
        .list-item { background: #fff; border: 2px solid #eef0f5; border-radius: 12px; padding: 12px; }
        .list-item .li-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .list-item input, .list-item select { padding: 7px 10px; border: 2px solid #e5e8ee; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; }
        .list-item .li-name { flex: 1; min-width: 70px; }
        .list-item .li-cls { width: 70px; }
        .list-item select { width: 64px; }
        .list-item .li-color { width: 36px; height: 36px; padding: 2px; border: 2px solid #e5e8ee; border-radius: 8px; cursor: pointer; }
        .list-item .li-del { margin-left: auto; border: none; background: #ffecec; color: #e74c3c; border-radius: 8px; width: 30px; height: 30px; font-size: 16px; cursor: pointer; }
        .list-item .li-bot { display: flex; gap: 8px; }
        .list-item .li-bot input { flex: 1; min-width: 0; }
        .add-card-btn { padding: 10px; border: 2px dashed #c9ced6; border-radius: 10px; background: #fff; color: #666; font-size: 14px; font-weight: 700; cursor: pointer; }
        .add-card-btn:hover { border-color: #2d3436; color: #2d3436; }

        /* 操作按钮 */
        .action-buttons { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 11px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: .15s; }
        .action-btn.primary { background: #2d3436; color: #fff; }
        .action-btn.success { background: #00b894; color: #fff; }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.15); }
        .hint-line { margin-top: 8px; font-size: 11.5px; color: #bbb; text-align: center; }

        /* ===== 卡片预览 ===== */
        .preview-label { font-size: 12px; color: #bbb; letter-spacing: 1px; margin-bottom: 12px; }
        .stage { display: flex; align-items: center; justify-content: center; width: 100%; }

        /* 单卡 */
        .card {
            position: relative; overflow: hidden;
            width: 100%; max-width: 400px; aspect-ratio: 0.7071;
            display: flex; flex-direction: column;
            border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.16);
        }
        .card .corner { position: absolute; width: 30px; height: 30px; border: 3px solid currentColor; opacity: .55; pointer-events: none; z-index: 3; }
        .card .corner-tl { top: 14px; left: 14px; border-right: none; border-bottom: none; border-top-left-radius: 6px; }
        .card .corner-br { bottom: 14px; right: 14px; border-left: none; border-top: none; border-bottom-right-radius: 6px; }
        .card .deco { position: absolute; border-radius: 50%; opacity: .07; pointer-events: none; z-index: 1; background: currentColor; }
        .card .deco-1 { width: 60%; height: 60%; top: -18%; right: -16%; }
        .card .deco-2 { width: 34%; height: 34%; bottom: -10%; left: -8%; }
        .card-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 2; padding: 12% 10%; }

        .card-mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; text-align: center; }
        .card-class { font-size: 20px; font-weight: 700; letter-spacing: 2px; padding: 5px 14px; border: 2px solid currentColor; border-radius: 999px; opacity: .95; white-space: nowrap; }
        .card-name { font-size: 46px; font-weight: 800; letter-spacing: 5px; line-height: 1.1; }
        .card-bottom { text-align: center; }
        .card-slogan { font-size: 18px; font-weight: 700; letter-spacing: 5px; margin-bottom: 4px; }
        .card-org { font-size: 13px; opacity: .78; letter-spacing: 1px; }

        /* 拼版 */
        .sheet { position: relative; background: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.18); border-radius: 4px; width: 100%; max-width: 560px; aspect-ratio: 0.7071; }
        .sheet-card { position: absolute; overflow: hidden; display: flex; flex-direction: column; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.10); }
        .sheet-card .card-content { padding: 9% 8%; }
        .sheet-card .card-class { font-size: 11px; padding: 3px 8px; letter-spacing: 1px; }
        .sheet-card .card-name { font-size: 22px; letter-spacing: 2px; }
        .sheet-card .card-slogan { font-size: 10px; letter-spacing: 3px; }
        .sheet-card .card-org { font-size: 8px; }
        .sheet-card .corner { width: 14px; height: 14px; border-width: 2px; top: 6px; left: 6px; }
        .sheet-card .corner-br { top: auto; left: auto; bottom: 6px; right: 6px; }
        .empty-hint { color: #c0c4cc; text-align: center; padding: 40px 0; font-size: 14px; }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .control-panel { flex: 1; width: 100%; }
            .preview-panel { min-width: 0; min-height: 400px; }
            .card { max-width: 320px; }
            .sheet { max-width: 360px; }
        }
        @media (max-width: 560px) {
            .app-container { padding: 14px 12px; border-radius: 16px; }
            .size-grid { grid-template-columns: repeat(4, 1fr); }
            .card { max-width: 260px; }
            .card-name { font-size: 34px; }
            .sheet { max-width: 300px; }
        }

        /* 打印 */
        @media print {
            body { background: #fff; padding: 0; }
            .app-container, .app-header, .control-panel, .preview-label { display: none !important; }
            .preview-panel { background: #fff !important; padding: 0 !important; }
            .card, .sheet { box-shadow: none !important; border-radius: 0 !important; max-width: 100% !important; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🏷️ 挂牌底卡生成器<small>A1–A8 · 拼版 · 存照片</small></h1>
            <span class="header-hint">📐 单卡 / 一版多卡 · 随意组合</span>
        </header>

        <div class="main-layout">
            <!-- ===== 左侧控制 ===== -->
            <div class="control-panel">
                <!-- 模式 -->
                <div class="control-group">
                    <label>🪄 模式</label>
                    <div class="mode-tabs" id="modeTabs">
                        <button class="mode-tab active" data-mode="single">单卡</button>
                        <button class="mode-tab" data-mode="sheet">拼版（一版多卡）</button>
                    </div>
                </div>

                <!-- 尺寸（单卡） -->
                <div class="control-group" id="sizeGroup">
                    <label>📏 卡片尺寸 <span class="unit">（A1–A8）</span></label>
                    <div class="size-grid" id="sizeGrid"></div>
                </div>

                <!-- 纸张（拼版） -->
                <div class="control-group" id="sheetSizeGroup" style="display:none;">
                    <label>📄 纸张尺寸 <span class="unit">（排布底纸）</span></label>
                    <div class="size-grid" id="sheetSizeGrid"></div>
                </div>

                <!-- 色卡 -->
                <div class="control-group">
                    <label>🎨 色卡 <span class="unit">（正方格横排）</span></label>
                    <div class="color-row" id="colorRow"></div>
                    <div class="custom-color-row">
                        <input type="color" id="customColor" value="#2d3436" />
                        <span>自定义颜色</span>
                    </div>
                </div>

                <!-- 字体颜色 -->
                <div class="control-group">
                    <label>🖋️ 字体颜色</label>
                    <div class="input-row">
                        <label>颜色</label>
                        <input type="color" id="fontColor" value="#ffffff" />
                        <label class="auto-font"><input type="checkbox" id="autoFontColor" checked /> 自动</label>
                    </div>
                    <div class="hint-line" style="text-align:left; margin-top:6px;">勾选“自动”按背景明暗配字色；取消后可手动选。</div>
                </div>

                <!-- 内容（单卡） -->
                <div class="control-group" id="contentGroup">
                    <label>✏️ 卡片内容</label>
                    <div class="input-group">
                        <div class="input-row"><label>班级</label><input type="text" id="inputClass" value="一1班" /></div>
                        <div class="input-row"><label>姓名</label><input type="text" id="inputName" value="张三" /></div>
                        <div class="input-row"><label>标语</label><input type="text" id="inputSlogan" value="文明礼仪" /></div>
                        <div class="input-row"><label>机构</label><input type="text" id="inputOrg" value="广州市番禺区市桥富..." /></div>
                    </div>
                </div>

                <!-- 拼版卡片列表 -->
                <div class="control-group" id="cardListGroup" style="display:none;">
                    <label>🃏 卡片列表 <span class="unit">（可自由增删、改尺寸/颜色）</span></label>
                    <div class="card-list" id="cardList"></div>
                    <button class="add-card-btn" id="addCardBtn">＋ 添加一张卡片</button>
                </div>

                <!-- 操作 -->
                <div class="control-group" style="background: transparent; padding: 0;">
                    <div class="action-buttons">
                        <button class="action-btn primary" id="printBtn">🖨️ 打印</button>
                        <button class="action-btn success" id="exportBtn">⬇️ 存照片</button>
                    </div>
                    <div class="hint-line">💡 导出为高清 PNG 照片</div>
                </div>
            </div>

            <!-- ===== 右侧预览 ===== -->
            <div class="preview-panel" id="previewPanel">
                <div class="preview-label" id="previewLabel">📋 单卡预览</div>
                <div class="stage" id="stage">
                    <div class="card" id="cardPreview">
                        <span class="corner corner-tl"></span>
                        <span class="corner corner-br"></span>
                        <div class="deco deco-1"></div>
                        <div class="deco deco-2"></div>
                        <div class="card-content">
                            <div class="card-mid">
                                <span class="card-class" id="previewClass">一1班</span>
                                <span class="card-name" id="previewName">张三</span>
                            </div>
                            <div class="card-bottom">
                                <div class="card-slogan" id="previewSlogan">文明礼仪</div>
                                <div class="card-org" id="previewOrg">广州市番禺区市桥富...</div>
                            </div>
                        </div>
                    </div>
                    <div class="sheet" id="sheetPreview" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // ===== 尺寸数据（A1–A8，宽高 mm，纵横比均为 1/√2）=====
        const SIZES = [
            { key: 'a1', label: 'A1', w: 594, h: 841 },
            { key: 'a2', label: 'A2', w: 420, h: 594 },
            { key: 'a3', label: 'A3', w: 297, h: 420 },
            { key: 'a4', label: 'A4', w: 210, h: 297 },
            { key: 'a5', label: 'A5', w: 148, h: 210 },
            { key: 'a6', label: 'A6', w: 105, h: 148 },
            { key: 'a7', label: 'A7', w: 74, h: 105 },
            { key: 'a8', label: 'A8', w: 52, h: 74 },
        ];
        const SHEET_SIZES = ['a3', 'a4', 'a5'];
        const ASPECT = 1 / Math.SQRT2;
        const sizeOf = (k) => SIZES.find(s => s.key === k);

        const PRESET_COLORS = [
            '#E74C3C', '#E67E22', '#F1C40F', '#2ECC71', '#1ABC9C', '#3498DB',
            '#5B6ABF', '#9B59B6', '#E91E8C', '#2C3E50', '#7F8C8D', '#34495E',
        ];

        // ===== DOM =====
        const $ = (id) => document.getElementById(id);
        const cardEl = $('cardPreview');
        const sheetEl = $('sheetPreview');
        const previewLabel = $('previewLabel');
        const colorRow = $('colorRow');
        const sizeGrid = $('sizeGrid');
        const sheetSizeGrid = $('sheetSizeGrid');
        const cardList = $('cardList');

        // ===== 状态 =====
        let mode = 'single';
        let currentSize = 'a4';
        let sheetSize = 'a4';
        let currentColor = '#2d3436';
        let cards = [];
        let uid = 1;

        // ===== 工具 =====
        function hexToRgb(hex) {
            const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
        }
        function hexWithAlpha(hex, a) {
            const rgb = hexToRgb(hex);
            return rgb ? `rgba(${rgb.r},${rgb.g},${rgb.b},${a})` : `rgba(0,0,0,${a})`;
        }
        function brightnessOf(hex) {
            const rgb = hexToRgb(hex);
            return rgb ? (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000 : 255;
        }

        // ===== 文字色 =====
        function resolveTextColor(bgHex) {
            if ($('autoFontColor').checked) {
                return brightnessOf(bgHex) > 180 ? '#1a1a2e' : '#ffffff';
            }
            return $('fontColor').value || '#1a1a2e';
        }

        // ===== 卡片模板（用于拼版）=====
        function cardInnerHTML(c) {
            const tc = resolveTextColor(c.color);
            return `<span class="corner corner-tl"></span><span class="corner corner-br"></span>` +
                `<div class="deco deco-1"></div><div class="deco deco-2"></div>` +
                `<div class="card-content">` +
                `<div class="card-mid"><span class="card-class">${esc(c.cls || '班级')}</span><span class="card-name">${esc(c.name || '姓名')}</span></div>` +
                `<div class="card-bottom"><div class="card-slogan">${esc(c.slogan || '标语')}</div><div class="card-org">${esc(c.org || '')}</div></div>` +
                `</div>`;
        }
        function esc(s) {
            return String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        // ===== 渲染单卡 =====
        function applyColor(hex) {
            currentColor = hex;
            const tc = resolveTextColor(hex);
            cardEl.style.backgroundColor = hex;
            cardEl.style.color = tc;
            $('previewClass').style.color = tc;
            $('previewName').style.color = tc;
            $('previewSlogan').style.color = tc;
            $('previewOrg').style.color = $('autoFontColor').checked
                ? (brightnessOf(hex) > 180 ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.7)')
                : hexWithAlpha(tc, .7);
        }
        function updateSingleContent() {
            $('previewClass').textContent = $('inputClass').value || '班级';
            $('previewName').textContent = $('inputName').value || '姓名';
            $('previewSlogan').textContent = $('inputSlogan').value || '标语';
            $('previewOrg').textContent = $('inputOrg').value || '机构名称';
        }

        // ===== 渲染色卡 =====
        function renderColors() {
            colorRow.innerHTML = '';
            PRESET_COLORS.forEach((hex) => {
                const d = document.createElement('div');
                d.className = 'color-swatch' + (hex === currentColor && mode === 'single' ? ' active' : '');
                d.style.backgroundColor = hex;
                d.innerHTML = '<span class="ck">✓</span>';
                d.onclick = () => { selectColor(hex); };
                colorRow.appendChild(d);
            });
        }
        function selectColor(hex) {
            currentColor = hex;
            $('customColor').value = hex;
            renderColors();
            if (mode === 'single') applyColor(hex);
        }

        // ===== 渲染尺寸 =====
        function renderSizes() {
            sizeGrid.innerHTML = '';
            SIZES.forEach((s) => {
                const b = document.createElement('button');
                b.className = 'size-btn' + (s.key === currentSize ? ' active' : '');
                b.textContent = s.label;
                b.onclick = () => { currentSize = s.key; renderSizes(); };
                sizeGrid.appendChild(b);
            });
            sheetSizeGrid.innerHTML = '';
            SHEET_SIZES.forEach((k) => {
                const s = sizeOf(k);
                const b = document.createElement('button');
                b.className = 'size-btn' + (k === sheetSize ? ' active' : '');
                b.textContent = s.label;
                b.onclick = () => { sheetSize = k; renderSizes(); renderSheet(); };
                sheetSizeGrid.appendChild(b);
            });
        }

        // ===== 拼版：卡片列表 =====
        function newCard() {
            return { id: uid++, cls: '一1班', name: '同学' + uid, slogan: '文明礼仪', org: '', color: PRESET_COLORS[uid % PRESET_COLORS.length], size: 'a6' };
        }
        function renderCardList() {
            cardList.innerHTML = '';
            cards.forEach((c, idx) => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML =
                    `<div class="li-top">` +
                    `<input class="li-name" placeholder="姓名" value="${esc(c.name)}">` +
                    `<input class="li-cls" placeholder="班级" value="${esc(c.cls)}">` +
                    `<select class="li-size">${SIZES.filter(s => ['a5','a6','a7','a8'].includes(s.key)).map(s => `<option value="${s.key}" ${s.key===c.size?'selected':''}>${s.label}</option>`).join('')}</select>` +
                    `<input type="color" class="li-color" value="${c.color}">` +
                    `<button class="li-del" title="删除">✕</button></div>` +
                    `<div class="li-bot">` +
                    `<input class="li-slogan" placeholder="标语" value="${esc(c.slogan)}">` +
                    `<input class="li-org" placeholder="机构" value="${esc(c.org)}">` +
                    `</div>`;
                item.querySelector('.li-name').oninput = (e) => { c.name = e.target.value; renderSheet(); };
                item.querySelector('.li-cls').oninput = (e) => { c.cls = e.target.value; renderSheet(); };
                item.querySelector('.li-size').onchange = (e) => { c.size = e.target.value; renderSheet(); };
                item.querySelector('.li-color').oninput = (e) => { c.color = e.target.value; renderSheet(); };
                item.querySelector('.li-slogan').oninput = (e) => { c.slogan = e.target.value; renderSheet(); };
                item.querySelector('.li-org').oninput = (e) => { c.org = e.target.value; renderSheet(); };
                item.querySelector('.li-del').onclick = () => { cards.splice(idx, 1); renderCardList(); renderSheet(); };
                cardList.appendChild(item);
            });
        }

        // ===== 拼版：布局 + 渲染 =====
        function layoutCards() {
            const sheet = sizeOf(sheetSize);
            const margin = 5; // mm
            const maxW = sheet.w - margin * 2, maxH = sheet.h - margin * 2;
            let x = margin, y = margin, rowH = 0;
            const placed = [];
            cards.forEach((c) => {
                const s = sizeOf(c.size);
                let w = s.w, h = s.h;
                const sc = Math.min(1, maxW / w, maxH / h);
                w *= sc; h *= sc;
                if (x + w > sheet.w - margin + 0.01) { x = margin; y += rowH + margin; rowH = 0; }
                placed.push({ c, x, y, w, h });
                x += w + margin;
                rowH = Math.max(rowH, h);
            });
            return placed;
        }
        function renderSheet() {
            sheetEl.innerHTML = '';
            if (!cards.length) {
                sheetEl.innerHTML = '<div class="empty-hint">还没有卡片，点左侧“＋ 添加一张卡片”</div>';
                return;
            }
            const sheet = sizeOf(sheetSize);
            const placed = layoutCards();
            placed.forEach(({ c, x, y, w, h }) => {
                const d = document.createElement('div');
                d.className = 'sheet-card';
                d.style.left = (x / sheet.w * 100) + '%';
                d.style.top = (y / sheet.h * 100) + '%';
                d.style.width = (w / sheet.w * 100) + '%';
                d.style.height = (h / sheet.h * 100) + '%';
                d.style.backgroundColor = c.color;
                d.style.color = resolveTextColor(c.color);
                d.innerHTML = cardInnerHTML(c);
                // 字号随尺寸缩放
                const nameSize = Math.max(9, Math.round(h / sheet.h * 46));
                const classSize = Math.max(8, Math.round(nameSize * 0.45));
                const sloganSize = Math.max(7, Math.round(nameSize * 0.42));
                d.querySelector('.card-name').style.fontSize = nameSize + 'px';
                d.querySelector('.card-class').style.fontSize = classSize + 'px';
                d.querySelector('.card-slogan').style.fontSize = sloganSize + 'px';
                d.querySelector('.card-org').style.fontSize = Math.max(6, sloganSize * 0.6) + 'px';
                sheetEl.appendChild(d);
            });
        }

        // ===== 模式切换 =====
        function setMode(m) {
            mode = m;
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
            $('sizeGroup').style.display = m === 'single' ? '' : 'none';
            $('contentGroup').style.display = m === 'single' ? '' : 'none';
            $('sheetSizeGroup').style.display = m === 'sheet' ? '' : 'none';
            $('cardListGroup').style.display = m === 'sheet' ? '' : 'none';
            $('cardPreview').style.display = m === 'single' ? '' : 'none';
            $('sheetPreview').style.display = m === 'sheet' ? '' : 'none';
            previewLabel.textContent = m === 'single' ? '📋 单卡预览' : '📋 拼版预览（一版多卡）';
            renderColors();
            if (m === 'single') applyColor(currentColor);
            else renderSheet();
        }

        // ===== 打印 =====
        function printTarget() {
            const target = mode === 'single' ? cardEl : sheetEl;
            const info = sizeOf(mode === 'single' ? currentSize : sheetSize);
            const orig = { w: target.style.width, h: target.style.height, aspect: target.style.aspectRatio, maxW: target.style.maxWidth };
            target.style.width = info.w + 'mm';
            target.style.height = info.h + 'mm';
            target.style.aspectRatio = 'auto';
            target.style.maxWidth = '100%';
            void target.offsetHeight;
            window.print();
            setTimeout(() => {
                target.style.width = orig.w; target.style.height = orig.h;
                target.style.aspectRatio = orig.aspect || String(ASPECT); target.style.maxWidth = orig.maxW;
            }, 400);
        }

        // ===== 导出照片 =====
        async function exportPNG() {
            const target = mode === 'single' ? cardEl : sheetEl;
            try {
                const canvas = await html2canvas(target, { scale: 4, useCORS: true, backgroundColor: mode === 'single' ? (cardEl.style.backgroundColor || '#fff') : '#ffffff', logging: false });
                const a = document.createElement('a');
                a.download = mode === 'single'
                    ? `挂牌底卡_${currentSize.toUpperCase()}_${$('inputName').value || '姓名'}.png`
                    : `挂牌底卡_拼版_${sheetSize.toUpperCase()}_${cards.length}张.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
            } catch (e) {
                alert('导出失败，请重试。');
            }
        }

        // ===== 事件 =====
        $('modeTabs').addEventListener('click', (e) => {
            const t = e.target.closest('.mode-tab');
            if (t) setMode(t.dataset.mode);
        });
        $('customColor').addEventListener('input', (e) => { selectColor(e.target.value); });
        $('autoFontColor').addEventListener('change', () => {
            $('fontColor').disabled = $('autoFontColor').checked;
            if (mode === 'single') applyColor(currentColor); else renderSheet();
        });
        $('fontColor').addEventListener('input', () => {
            if (!$('autoFontColor').checked) { if (mode === 'single') applyColor(currentColor); else renderSheet(); }
        });
        ['inputClass', 'inputName', 'inputSlogan', 'inputOrg'].forEach(id => $(id).addEventListener('input', updateSingleContent));
        $('addCardBtn').addEventListener('click', () => { cards.push(newCard()); renderCardList(); renderSheet(); });
        $('printBtn').addEventListener('click', printTarget);
        $('exportBtn').addEventListener('click', exportPNG);

        // ===== 初始化 =====
        function init() {
            $('fontColor').disabled = true;
            renderColors();
            renderSizes();
            updateSingleContent();
            applyColor(currentColor);
            if (cards.length === 0) { cards.push(newCard()); cards.push(newCard()); }
            renderCardList();
            setMode('single');
        }
        init();
        window.__cardGen = { setMode, exportPNG, printTarget };
    })();
    </script>
</body>
