name: Build iOS

on:
  workflow_dispatch:
    inputs:
      sign:
        description: '是否签名（需先配置 Apple 证书 Secrets）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor (CocoaPods)
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: cd ios/App && pod install

      # —— 未签名构建（无需证书，产物为 .app，不能直接安装到真机）——
      - name: Build unsigned .app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload unsigned .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: ios/App/build/Build/Products/Release-iphoneos/*.app

      # 未签名 IPA（可用免费 Apple ID 经 Sideloadly/AltStore 重签名安装）
      - name: Package unsigned IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R *.app Payload/
          zip -qr PinyinWarrior-iOS-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ios/App/build/Build/Products/Release-iphoneos/PinyinWarrior-iOS-unsigned.ipa

      - name: Attach unsigned IPA to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/App/build/Build/Products/Release-iphoneos/PinyinWarrior-iOS-unsigned.ipa

      # —— 签名 + 导出可安装 IPA（需要配置以下 Secrets 并把上方 sign 打开）——
      # 需在仓库 Settings → Secrets and variables → Actions 中配置：
      #   BUILD_CERTIFICATE_BASE64  分发证书 .p12 的 base64
      #   P12_PASSWORD              证书密码
      #   BUILD_PROVISION_PROFILE_BASE64  描述文件 .mobileprovision 的 base64
      #   KEYCHAIN_PASSWORD         临时钥匙串密码
      - name: Import signing certificate
        if: inputs.sign
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive and export IPA
        if: inputs.sign
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/ipa -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        if: inputs.sign
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: ios/App/build/ipa/*.ipa

      - name: Attach IPA to release (on tag)
        if: startsWith(github.ref, 'refs/tags/') && inputs.sign
        uses: softprops/action-gh-release@v2
        with:
          files: ios/App/build/ipa/*.ipa
